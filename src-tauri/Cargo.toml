[package]
name = "config-reviewer"
version = "0.1.0"
description = "内网 Windows 桌面端配置评审台"
authors = ["gongfpp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "config_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
globset = "0.4.20"
encoding_rs = "0.8.41"
futures-util = "0.3.34"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
calamine = "0.36.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tauri-plugin-dialog = "2.7.3"
rust_xlsxwriter = "0.99.1"
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS 使用 Keychain 作为系统凭据库（Windows 默认使用凭据管理器）
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
